name: astrbot_plugin_toolmsg_flatten
display_name: 工具行为改写
short_desc: 在请求发出前动手术：搜索、历史、视觉、排障，一整套行为改写。
desc: >-
  不改本体一行代码，只在两个时刻动手：请求即将发出的那一刻，和工具交回结果的那一刻。
  现在主要做六件事——联网搜索只掏段落摘要、会话历史（群聊+私聊）交给助手模型翻查后
  只交回摘要、看不了图的模型借图片转述模型读图、请求体检、提示词来源追踪、
  抓包页排障（含一键终止全部在跑的请求）。
  旧的“工具回传换身份”和轮次闸门作为兼容功能保留，默认关闭。
help: >-
  装上即可，无需命令，六件事都能在配置里单独关。
  一、联网搜索只掏段落摘要：本体那个搜索工具掏的是长摘要（一次八条上万字），
  这里改成只掏短的（一两百字），是换口袋拿不是砍断。
  二、接管会话历史查询：主模型只说“要查什么”“大概哪个时间段”，插件先把人话时间
  翻成具体起止，再按时间窗去库里筛，切块交给助手模型整理，原始消息立刻丢掉，
  最后只交回一段摘要。群聊接管本体的工具，私聊接管私聊历史插件的查询入口。
  三、让看不了图的模型也能用视觉回溯：取图那一步交回来的图片，先交给图片转述模型
  看一眼，换成文字再给主模型。主模型本来能看图时不起作用。
  四、请求体检：发之前机器过一遍结构，查重复段落、工具调用与结果配对、超长单条、
  工具结果占比、多条系统提示、空消息。只报告不动手。
  五、提示词来源追踪：包住每个请求时钩子，前后快照做差，抓包页按来源染色，
  主体部分是哪个插件加的一目了然。追不到本体自己拼的那部分。
  六、抓包页：每次真正发出去的内容一条一行，带“谁发起的”；顶栏方块键可以
  一键终止所有会话正在跑的请求（点两次确认）。
  旧的“工具回传换身份”和轮次闸门作为兼容选项保留，默认关闭。

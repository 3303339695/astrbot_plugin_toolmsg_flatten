name: astrbot_plugin_toolmsg_flatten
display_name: 工具回传改写
short_desc: 只换工具回传的身份，内容原样搬。
desc: >-
  发请求前把“工具回传”那一整段原样搬进一条普通消息（只换身份，不套模板、不改格式），
  避开上游要求函数名导致的拒收；存储、工具申请、提示词一律原样。
  另外带一道轮次闸门：一次提问里工具来回够了就把工具收走，逼它开口。
help: >-
  装上即可，无需命令。配置里可调：换成哪一种身份、一次提问最多来回几轮、单条与合计字数上限。
  插件卡片上的“查看界面”是抓包页，能看到每次请求的真实内容。
version: v4.2.0
author: 咱
repo: ""
astrbot_version: ">=4.20.0"
